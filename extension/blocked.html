<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dangerous site blocked — Alvora Cyber</title>
  <style>
    :root { --bg: #0a0f1a; --card: #0f1623; --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b; --accent: #ef4444; }
    :root[data-verdict="suspicious"] { --accent: #f59e0b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: 560px; max-width: 100%; background: var(--card);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 18px; padding: 32px;
      box-shadow: 0 0 80px color-mix(in srgb, var(--accent) 12%, transparent), 0 24px 64px rgba(0,0,0,.5);
    }
    .icon {
      width: 52px; height: 52px; border-radius: 14px; margin-bottom: 20px;
      display: flex; align-items: center; justify-content: center;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    h1 { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .host {
      font-family: 'SF Mono', Menlo, monospace; font-size: 14px; color: var(--accent);
      word-break: break-all; margin-bottom: 16px;
    }
    p { font-size: 14px; line-height: 1.6; color: var(--muted); margin-bottom: 12px; }
    .sources { font-size: 12px; color: var(--faint); margin-bottom: 24px; }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; border-radius: 10px; transition: background .15s, color .15s; }
    .primary { padding: 11px 22px; border: 0; background: #00e5ff; color: #0a0f1a; font-weight: 700; font-size: 14px; }
    .primary:hover { background: #5ff0ff; }
    .link { padding: 8px 4px; border: 0; background: none; color: var(--faint); font-size: 12px; text-decoration: underline; }
    .link:hover { color: var(--muted); }
    .footer { margin-top: 28px; font-size: 11px; color: #334155; }
    .footer strong { color: #00e5ff; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" id="iconSvg">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <line x1="12" y1="8" x2="12" y2="13"/><circle cx="12" cy="16.5" r=".6"/>
      </svg>
    </div>
    <h1 id="title">Dangerous site blocked</h1>
    <div class="host" id="host"></div>
    <p id="reason"></p>
    <p id="advice">Don't enter passwords, codes or card details here. If a message or email sent you this link, it's likely a scam.</p>
    <div class="sources" id="sources"></div>
    <div class="actions">
      <button class="primary" id="back">Go back to safety</button>
      <button class="link" id="proceed">I understand the risk — continue anyway</button>
    </div>
    <div class="footer">Checked on your device by <strong>Alvora Cyber</strong> Link Guard — the address never left your computer.</div>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
